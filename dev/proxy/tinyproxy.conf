# tinyproxy for the proxy test. The start command adds the BasicAuth line.
Port 3128
Listen 0.0.0.0
Timeout 60
# Info names each request and each CONNECT tunnel. Without LogFile and Syslog,
# tinyproxy writes the log to standard error, so `docker logs` shows it.
LogLevel Info
MaxClients 50
# The CONNECT tunnel to the TLS front of the API.
ConnectPort 8443
ConnectPort 443
