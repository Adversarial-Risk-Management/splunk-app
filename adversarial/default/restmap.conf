#
# Adversarial - save-time validation.
#
# Splunk runs this check when a user saves an alert. It stops an alert that
# would fail later with exit code 2. An unset field evaluates to its own name,
# so the check tests for that string and for an empty string.
#

[validation:savedsearch]
action.adversarial_incident = case('action.adversarial_incident' != "1", null(), 'action.adversarial_incident.param.title' == "action.adversarial_incident.param.title" OR 'action.adversarial_incident.param.title' == "", "The Adversarial incident title cannot be empty.", 1==1, null())
action.adversarial_risk = case('action.adversarial_risk' != "1", null(), 'action.adversarial_risk.param.title' == "action.adversarial_risk.param.title" OR 'action.adversarial_risk.param.title' == "", "The Adversarial risk title cannot be empty.", 1==1, null())
