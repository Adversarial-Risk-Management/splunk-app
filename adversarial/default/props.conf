#
# Adversarial - source types of the sample data.
#
# The example alerts search events of these source types. The events are JSON,
# so Splunk extracts the fields at search time.
#
#   demo:auth      authentication events, for the detection alert
#   demo:posture   endpoint check-in events, for the posture alert
#
# Your own data uses your own source types. Change the search of the example
# alerts in savedsearches.conf to match your data.
#

[demo:auth]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 10000

[demo:posture]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "timestamp":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 10000
