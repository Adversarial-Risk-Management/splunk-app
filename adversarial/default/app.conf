#
# Adversarial - app registration.
#

[install]
state = enabled
# The app ships with no credentials, so it is not configured. Splunk opens the
# setup page when a user opens the app. The setup page, or the script
# bin/configure_credentials.py, stores the credentials in the Splunk secret
# store and then sets the flag to 1 in local/app.conf.
is_configured = 0

[ui]
is_visible = 1
label = Adversarial
setup_view = adversarial_setup

[launcher]
author = Adversarial
description = Create Adversarial incidents and risks from Splunk alerts with a service account.
version = 1.1.0

[id]
name = adversarial
version = 1.1.0

[package]
id = adversarial
# The app is an example, not a Splunkbase listing, so Splunk does not look for
# a newer version.
check_for_updates = false
