#
# Adversarial - app registration.
#

[install]
state = enabled
# The app ships with no credentials. The setup page, or the script
# bin/configure_credentials.py, stores them in the Splunk secret store.
# The flag stays at 1 so that Splunk does not force a redirect to the setup
# page. Open the setup page from Apps > Manage Apps > Set up.
is_configured = 1

[ui]
is_visible = 1
label = Adversarial
setup_view = adversarial_setup

[launcher]
author = Adversarial
description = Create Adversarial incidents and risks from Splunk alerts with a service account.
version = 1.1.0

[id]
name = adversarial
version = 1.1.0

[package]
id = adversarial
# The app is an example, not a Splunkbase listing, so Splunk does not look for
# a newer version.
check_for_updates = false
