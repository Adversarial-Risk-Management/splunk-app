#
# Adversarial - example alerts.
#
# The app holds two example alerts, one for each action. Both are disabled, and
# their schedules are off, so a new install creates no records. To see one work:
#
#   1. Load sample data into the `main` index. See dev/README.md.
#   2. Settings > Searches, reports, and alerts > (the alert) > Edit > Enable.
#
# The two alerts show the difference between the record types:
#
#   A detection search finds an event, and the incident holds the event.
#
#   A posture search finds a standing condition. The whole condition is one
#   risk, so the search aggregates to one row.
#
# Splunk starts an alert action one time for each alert firing, and it sends the
# first search result. Both searches therefore end with a command that puts the
# row that matters first: `sort` for the detection, and `stats` for the posture
# search.
#
# Point each search at your own index and source type to use your own data.
#

## Detection: an incident for the host above the threshold --------------------

[Adversarial demo - brute force]
description = Example alert. It counts failed logins for each host, and creates one Adversarial incident for a host above the threshold.
search = index=main sourcetype="demo:auth" outcome=failure \
| stats count AS failed_logins, latest(src_ip) AS src_ip, values(user) AS user, latest(app) AS app BY dest \
| where failed_logins >= 20 \
| sort - failed_logins

disabled = 1
enableSched = 0
cron_schedule = */5 * * * *
dispatch.earliest_time = -60m
dispatch.latest_time = now
counttype = number of events
quantity = 0
relation = greater than
# 5 is "severe" in Splunk. The action maps it to SEV-2 when param.severity is
# `auto`.
alert.severity = 5
alert.track = 1
# The alert runs every 5 minutes, and an attack lasts longer than one run.
# Suppression holds the whole alert down for 24 hours after a firing, so the
# host does not give a new incident on every run.
alert.suppress = 1
alert.suppress.period = 24h

action.adversarial_incident = 1
action.adversarial_incident.param.title = Brute force on $result.dest$
action.adversarial_incident.param.description = Splunk counted $result.failed_logins$ failed logins for user $result.user$ from $result.src_ip$ in the last hour.
# The alert holds a trustworthy severity, so the example maps it. Leave this
# setting empty to let AI Suggest Score assign the severity.
action.adversarial_incident.param.severity = auto
action.adversarial_incident.param.severity_reasoning = A high number of failed logins on a gateway host points to an active credential attack.
action.adversarial_incident.param.status = New
action.adversarial_incident.param.source = SIEM
action.adversarial_incident.param.fields = dest,failed_logins,src_ip,user,app
action.adversarial_incident.param.add_comment = 1


## Posture: one risk for the whole condition ----------------------------------

[Adversarial demo - endpoint agent coverage]
description = Example alert. It counts the endpoints that report no endpoint agent, and creates one Adversarial risk for the gap in coverage.
# The first `stats` keeps the newest check-in of each host. The second `stats`
# turns the hosts into one row, because the whole gap is one risk. `mvjoin`
# makes a single string, so the $result.business_units$ token holds every unit.
search = index=main sourcetype="demo:posture" check="endpoint_baseline" \
| stats latest(agent_installed) AS agent_installed, latest(os) AS os, latest(business_unit) AS business_unit BY dest \
| where agent_installed="false" \
| stats count AS hosts, values(dest) AS host_list, values(os) AS os_list, values(business_unit) AS business_units \
| eval business_units=mvjoin(business_units, ", ") \
| where hosts >= 5

disabled = 1
enableSched = 0
# A posture search runs once a day. The condition does not change by the minute.
cron_schedule = 0 7 * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
quantity = 0
relation = greater than
# 4 is "error" in Splunk. The action maps it to an initially reported urgency
# of Medium when param.iru is `auto`.
alert.severity = 4
alert.track = 1
# One risk for the condition. The search runs every day, but the risk stays
# open until somebody remediates it, so the alert suppresses a repeat.
alert.suppress = 1
alert.suppress.period = 7d

action.adversarial_risk = 1
action.adversarial_risk.param.title = Endpoint agent missing on $result.hosts$ endpoints
action.adversarial_risk.param.description = Splunk found $result.hosts$ endpoints with no endpoint agent in the last 24 hours. Affected business units: $result.business_units$. An endpoint without the agent gives no telemetry and no blocking, so an attacker on that host stays unseen.
action.adversarial_risk.param.type = Control Deficiency
action.adversarial_risk.param.source = Attack Surface Monitoring
action.adversarial_risk.param.status = New
# The alert severity is the raw score of the reporting source, which is what
# the initially reported urgency holds.
action.adversarial_risk.param.iru = auto
# The likelihood and the impact stay empty. AI Suggest Score assigns them from
# the title, the description and the comments, and the platform then derives
# the urgency and the due date.
action.adversarial_risk.param.likelihood =
action.adversarial_risk.param.impact =
action.adversarial_risk.param.remediation_task = Install the endpoint agent on each host in the list. Add a check to the build image, so a new host cannot join without the agent.
action.adversarial_risk.param.fields = hosts,host_list,os_list,business_units
action.adversarial_risk.param.add_comment = 1
