#
# Adversarial - custom alert actions.
#
# The app holds two actions. Use `adversarial_incident` for an event that needs
# a responder now, and `adversarial_risk` for a standing condition that the
# organization remediates over time. One alert can use both.
#
# Every `param.*` setting below is a default. The alert form in Splunk Web
# overrides a value for one alert. An SPL search can also set a value:
#
#   | sendalert adversarial_incident param.title="Test incident"
#   | sendalert adversarial_risk param.title="Test risk"
#
# Splunk expands `$...$` tokens in a parameter before it starts the script, so
# `$name$` becomes the name of the alert, and `$result.<field>$` becomes a field
# of the first result. Splunk replaces an unknown `$...$` token with an empty
# string. The script expands `{{row.<field>}}` from the row that gives the
# record. Use `{{row.<field>}}` when `param.records = each`.
#
# The score fields (`param.severity` for an incident, `param.likelihood` and
# `param.impact` for a risk) are empty by default. The platform does not score
# a record that the API creates: a person scores it, for example with AI
# Suggest Score. Set a value only when the alert holds one that you trust.
#

[adversarial_incident]
is_custom = 1
label = Create Adversarial incident
description = Create an incident in the Adversarial platform
icon_path = appIcon.png
payload_format = json
# Splunk 10.2 and later read python.required, which takes precedence. Splunk 9
# reads python.version.
python.version = python3
python.required = 3.13

## Connection --------------------------------------------------------------
# Leave these empty to use the values from the setup page. Set them to send
# the records of one alert to a different service account or organization.
#
# There is no `param.client_secret`. Splunk keeps a saved alert in plain text,
# so the client secret stays in the Splunk secret store: store the secret of
# another client ID with `bin/configure_credentials.py --add-client`. The
# script accepts a `client_secret` value in the payload only for a test
# outside Splunk.
param.base_url =
param.client_id =

## Incident fields ---------------------------------------------------------
param.title = Splunk alert: $name$
param.description =
# Empty leaves the severity empty, for a person to score. `auto` maps the Splunk alert
# severity. To force a value, use SEV-1, SEV-2, SEV-3, SEV-4 or SEV-5.
param.severity =
param.severity_reasoning =
param.status = New
# The source must exist in your organization. See Settings > Incidents.
param.source = SIEM
# Comma-separated item tags. Each tag must exist in your organization: the
# platform does not create a tag, and it rejects an unknown one.
param.tags =
# Comma-separated field names from the search result. A name can hold a
# wildcard, for example `src_*`.
param.fields = host,source,sourcetype
# Add a comment that links back to the Splunk search results.
param.add_comment = 1

## Records -----------------------------------------------------------------
# `one` creates one record from the first result. `each` creates one record
# for each result, up to `param.max_records`. `0` means no limit.
param.records = one
param.max_records = 25

## Values that Splunk supplies ---------------------------------------------
# These tokens are available only in a parameter, so the script reads them
# from the configuration instead of the payload.
param.info_severity = $alert.severity$
param.info_trigger_time = $trigger_time$


[adversarial_risk]
is_custom = 1
label = Create Adversarial risk
description = Create a risk in the Adversarial platform
icon_path = appIcon.png
payload_format = json
python.version = python3
python.required = 3.13

## Connection --------------------------------------------------------------
param.base_url =
param.client_id =

## Risk fields -------------------------------------------------------------
param.title = Splunk alert: $name$
param.description =
# The type of the risk: Code, Configuration, Control Deficiency, Policy,
# Procedural, Vulnerability or Third-party. Empty gives Control Deficiency.
param.type = Control Deficiency
# The source must exist in your organization. See Settings > Risks.
param.source = Attack Surface Monitoring
# Comma-separated item tags. Each tag must exist in your organization.
param.tags =
param.status = New
# Initially Reported Urgency (IRU): the raw score of the reporting source. Empty
# leaves it out. `auto` maps the Splunk alert severity. To force a value, use
# Critical, High, Medium, Low or Info.
param.iru =
# Empty leaves the likelihood and the impact empty, for a person to score. The
# platform derives the urgency, and then the due date, from the pair.
# Likelihood: Remote, Unlikely, Possible, Probable or Imminent.
# Impact: Very Low, Low, Medium, High or Severe.
param.likelihood =
param.impact =
param.likelihood_reason =
param.impact_reason =
# What the organization must do, and which controls address the risk.
param.remediation_task =
param.control_statement =
param.fields = host,source,sourcetype
param.add_comment = 1

## Records -----------------------------------------------------------------
param.records = one
param.max_records = 25

## Values that Splunk supplies ---------------------------------------------
param.info_severity = $alert.severity$
param.info_trigger_time = $trigger_time$
